services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: neurodesk_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - neurodesk_network

volumes:
  qdrant_storage:
    driver: local

networks:
  neurodesk_network:
    driver: bridge