services:
  - type: web
    name: neurodesk-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --break-system-packages yt-dlp
      npm install --legacy-peer-deps
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false